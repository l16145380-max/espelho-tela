name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar APK Simples com Android nativo básico
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          echo 'include(":app")' > settings.gradle
          echo 'rootProject.name = "EspelhoTela"' >> settings.gradle

      - name: Criar Estrutura Básica do Gradle e Compilar
        run: |
          cd android
          echo "android { compileSdkVersion 33 }" > build.gradle
          # Cria um projeto gradle mínimo direto para gerar o APK com os ficheiros web
