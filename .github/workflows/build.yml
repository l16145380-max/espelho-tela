name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Dependências e Capacitor
        run: |
          npm install
          npm install -g @capacitor/cli @capacitor/core

      - name: Adicionar Capacitor Android Diretamente
        run: |
          npx cap add android --no-telemetry

      - name: Copiar Ficheiros Web para o Android
        run: npx cap copy android

      - name: Gerar APK de Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar Ficheiro APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
