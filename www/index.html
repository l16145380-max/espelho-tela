<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Espelho de Tela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Espelho de Tela P2P</h1>
        <p>O seu app nativo foi compilado com sucesso!</p>
        <button onclick="alert('App pronto a funcionar no telemóvel!')">Testar App</button>
    </div>

</body>
</html>
